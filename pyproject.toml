[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopress"
version = "0.1.0"
description = "Yerel Türkçe sesle oyun tuş kontrolü"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["PySide6>=6.7,<7", "vosk>=0.3.45", "sounddevice>=0.4.7", "psutil>=5.9", "numpy>=2.1", "onnxruntime>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
autopress = "autopress.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autopress = ["resources/neural/*.onnx", "resources/neural/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
